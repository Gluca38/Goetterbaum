<h2>Einladung zu Götterbaum</h2>
<p>Hallo,</p>
<p>
  du hast einen Zugang zu Götterbaum bekommen. Bitte lege über den folgenden
  Link dein Passwort fest. Danach bist du direkt angemeldet.
</p>
<p>
  <a href="{{ .SiteURL }}/auth/bestaetigen?token_hash={{ .TokenHash }}&type=invite">Passwort festlegen</a>
</p>
<p>Der Link ist nur begrenzt gültig. Ist er abgelaufen, schickt dir das Büro gern eine neue Einladung.</p>
