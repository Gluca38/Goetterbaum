name: Migrationen auf Produktion

# Nach dem Zusammenführen in main werden neue Migrationen auf die
# Produktionsdatenbank angewendet. Es wird nur der Bauplan (Tabellen,
# Zugriffsregeln) übertragen, niemals Daten.
on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  # Erlaubt zusätzlich einen Start per Knopfdruck unter "Actions"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-produktion-migrationen
  cancel-in-progress: false

jobs:
  # Probelauf auf einer Wegwerf-Datenbank im GitHub-Runner (ADR-0003).
  # Scheitert er, wird Produktion nicht angefasst.
  migrationen-probelauf:
    name: Migrationen-Probelauf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Neue Migrationen stehen in begin; … commit;
        run: bash scripts/pruefe-migrationen.sh
      - name: Alle Migrationen auf einer Wegwerf-Datenbank einspielen
        run: npx supabase db start

  migrationen:
    name: Migrationen auf Produktion
    needs: migrationen-probelauf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx supabase db push --db-url "$PRODUCTION_DB_URL"
        env:
          PRODUCTION_DB_URL: ${{ secrets.PRODUCTION_DB_URL }}
      # Die Supabase-Schnittstelle (PostgREST) liest danach ihre Liste der
      # Tabellen neu ein. Sonst kennt sie neue Tabellen nicht und die App
      # stürzt ab (so geschehen nach #28, siehe #29).
      - name: Schnittstelle liest die Tabellen neu ein
        run: psql "$PRODUCTION_DB_URL" -v ON_ERROR_STOP=1 -c "notify pgrst, 'reload schema';"
        env:
          PRODUCTION_DB_URL: ${{ secrets.PRODUCTION_DB_URL }}
