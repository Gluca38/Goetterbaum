name: E2E-Tests

# Vercel meldet GitHub, wenn eine Preview fertig gebaut ist. Erst dann
# laufen die Browsertests, und zwar gegen genau diese Preview, die mit
# Supabase-Staging verbunden ist. Die Produktionsdatenbank wird nie berührt.
on: deployment_status

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  # Probelauf auf einer Wegwerf-Datenbank im GitHub-Runner (ADR-0003).
  # Scheitert er, wird Staging nicht angefasst.
  migrationen-probelauf:
    name: Migrationen-Probelauf
    if: >-
      github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment.environment, 'Preview')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Neue Migrationen stehen in begin; … commit;
        run: bash scripts/pruefe-migrationen.sh
      # Startet eine frische Supabase-Datenbank (Docker) und spielt dort
      # alle Migrationen ein, auf demselben Weg wie danach auf Staging
      - name: Wegwerf-Datenbank starten
        run: npx supabase db start
      - name: Alle Migrationen auf der Wegwerf-Datenbank einspielen
        run: npx supabase db push --local --include-all

  staging-migrationen:
    name: Migrationen auf Staging
    needs: migrationen-probelauf
    runs-on: ubuntu-latest
    # Nie zwei Läufe gleichzeitig an der Staging-Datenbank bauen lassen
    concurrency:
      group: supabase-staging-migrationen
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Wendet neue Dateien aus supabase/migrations auf Staging an
      - run: npx supabase db push --include-all --db-url "$STAGING_DB_URL"
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}

  e2e-tests:
    # Name muss "E2E-Tests" bleiben: Pflicht-Prüfung in den Regeln für main
    name: E2E-Tests
    needs: staging-migrationen
    # Läuft auch, wenn Probelauf oder Staging-Migrationen gescheitert sind.
    # Sonst wäre diese Pflicht-Prüfung nur "übersprungen", und das zählt bei
    # GitHub als bestanden.
    if: >-
      !cancelled() &&
      github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment.environment, 'Preview')
    runs-on: ubuntu-latest
    concurrency:
      group: e2e-${{ github.event.deployment.sha }}
      cancel-in-progress: true
    steps:
      - name: Datenbank-Migrationen müssen geklappt haben
        if: needs.staging-migrationen.result != 'success'
        run: |
          echo "::error::Der Migrationen-Probelauf oder die Migrationen auf Staging sind gescheitert. Details stehen in diesen Jobs."
          exit 1
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_BASE_URL: ${{ github.event.deployment_status.target_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          # Nur das Test-Setup nutzt ihn, um Test-Firmen anzulegen und zu entfernen
          SUPABASE_SECRET_KEY: ${{ secrets.STAGING_SUPABASE_SECRET_KEY }}
      # Bei Fehlern den Playwright-Bericht zum Herunterladen bereitstellen
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
